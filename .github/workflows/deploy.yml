name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # deploy-pages resolves the artifact by id; without this it 403s

concurrency:
  group: pages
  # Never cancel a deployment that is already talking to Pages — a half-finished
  # one leaves the site in a worse state than just waiting for it.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # These majors all run on node24; v4/v3 ran on the now-deprecated node20.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # stamp-updated reads each data file's commit date
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run stamp
      - run: npm run build
      # v4+ excludes dotfiles from the artifact; dist/ has none that matter.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Pages has been taking 8-10 min per deploy since the custom domain
          # was set, overrunning the 10 min default. Milliseconds.
          timeout: 1800000
