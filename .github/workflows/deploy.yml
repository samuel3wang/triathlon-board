name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # deploy-pages resolves the artifact by id; without this it 403s

concurrency:
  group: pages
  # Never cancel a deployment that is already talking to Pages — a half-finished
  # one leaves the site in a worse state than just waiting for it.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # These majors all run on node24; v4/v3 ran on the now-deprecated node20.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # stamp-updated reads each data file's commit date
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run stamp
      - run: npm run build
      # v4+ excludes dotfiles from the artifact; dist/ has none that matter.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The `timeout` input cannot be raised — the action clamps it with
      # `Math.min(input, 600000)` — and Pages currently needs longer than that
      # 10 min ceiling, then publishes anyway a few minutes after the action
      # has given up. So its verdict is not evidence either way; the next step
      # is what decides whether this run passes.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      # Ask the live site what it is actually serving. `__COMMIT_SHA__` ships
      # inside the hashed JS bundle (see CLAUDE.md), so finding this run's sha
      # there means this exact build is live — nothing else is trusted.
      - name: Confirm the site is serving this commit
        run: |
          sha="${GITHUB_SHA:0:7}"
          site="${{ steps.deployment.outputs.page_url }}"
          [ -n "$site" ] || site="https://triathlontw.com/"
          site="${site%/}"
          echo "looking for $sha on $site"
          for i in $(seq 1 50); do
            js=$(curl -sSL --max-time 20 "$site/" \
                 | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1)
            if [ -n "$js" ] && curl -sSL --max-time 30 "$site/$js" | grep -q "$sha"; then
              echo "::notice::$site is serving $sha after $((i * 30))s"
              exit 0
            fi
            sleep 30
          done
          # Pages caches HTML for 600s, so allow for a stale index.html above.
          echo "::error::$site never served $sha - the deployment really did fail"
          exit 1
