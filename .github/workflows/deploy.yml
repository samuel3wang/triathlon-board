name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # deploy-pages resolves the artifact by id; without this it 403s

concurrency:
  group: pages
  # Never cancel a deployment that is already talking to Pages — a half-finished
  # one leaves the site in a worse state than just waiting for it.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Rolled back to the exact versions of the last deploy that succeeded
      # (581c589), to take them out of the picture while deploys are failing.
      # They run on node20 and the runners now warn about that; re-bump to
      # checkout@v7 / setup-node@v7 / upload-pages-artifact@v5 once Pages is
      # deploying reliably again.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # stamp-updated reads each data file's commit date
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run stamp
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Do not try to raise the `timeout` input: the action clamps it with
      # `Math.min(input, 600000)`, so 10 minutes is a hard ceiling. If a deploy
      # overruns it, the deploy itself has to get faster — see CLAUDE.md.
      - id: deployment
        uses: actions/deploy-pages@v4
